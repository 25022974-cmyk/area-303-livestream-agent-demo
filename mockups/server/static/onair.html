<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>On-air Assistant · AREA_303</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="static/css/style.css">
</head>
<body class="min-h-full" x-data="onair()" x-init="init()" x-cloak>
  <header class="border-b bg-white">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center gap-3">
      <a href="index.html" class="w-9 h-9 rounded-xl flex items-center justify-center text-white font-extrabold" style="background:var(--brand)">A3</a>
      <div class="flex-1 min-w-0">
        <div class="font-extrabold leading-none">On-air Assistant</div>
        <div class="text-xs muted truncate">
          Phiên: <span x-text="draft.slot || 'T5 20:00–21:30'"></span>
          · <span x-text="selectedItems.length"></span> SKU
        </div>
      </div>
      <div class="progress hidden md:flex">
        <div class="seg done"><span class="dot"></span><a href="prelive.html" class="hover:underline">1 · Pre</a></div>
        <div class="bar done"></div>
        <div class="seg active"><span class="dot"></span><span>2 · On-air</span></div>
        <div class="bar"></div>
        <div class="seg"><span class="dot"></span><span>3 · Post</span></div>
      </div>
      <span x-show="live" class="tag" style="background:#fee2e2;color:#7f1d1d"><span class="badge-dot live-dot mr-1"></span> ON-AIR</span>
      <span x-show="!live" class="tag" style="background:#f3f4f6;color:#6b7280">chưa bắt đầu</span>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-5">
    <!-- empty state -->
    <template x-if="!selectedItems.length && !live">
      <div class="card p-8 text-center">
        <div class="text-4xl mb-2">🛒</div>
        <div class="font-bold text-lg">Chưa có playbook cho phiên này</div>
        <p class="muted text-sm mt-1 max-w-md mx-auto">Quay về Pre-live Planner, chọn SKU / khung giờ / voucher rồi bấm “Tạo playbook & sang On-air”. Draft đã lưu sẽ tự động tải về đây.</p>
        <a href="prelive.html" class="btn btn-primary mt-4 inline-flex">← Lập phiên live</a>
      </div>
    </template>

    <template x-if="selectedItems.length || live">
      <div class="grid lg:grid-cols-12 gap-4">
        <!-- LEFT: timeline run-of-show -->
        <aside class="lg:col-span-4 space-y-2">
          <div class="flex items-center justify-between mb-1">
            <div class="section-h"><span class="step">≡</span> Run-of-show</div>
            <div class="text-xs mono muted" x-text="elapsedLabel()"></div>
          </div>
          <div class="timeline space-y-2">
            <template x-for="(s,idx) in show" :key="idx">
              <div class="slot" :class="idx===current ? 'active' : (idx<current?'done':'')" @click="selectSlot(idx)">
                <div class="flex items-start gap-3">
                  <span class="num" x-text="idx+1"></span>
                  <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 flex-wrap">
                      <span class="tag" :class="roleTag(s.role)" x-text="roleLabel(s.role)"></span>
                      <span class="font-semibold text-sm truncate" x-text="s.title"></span>
                    </div>
                    <div class="text-[11px] muted mt-0.5" x-text="s.subtitle"></div>
                    <div class="flex items-center gap-2 mt-1 text-[11px]">
                      <span class="muted" x-text="`${s.startLabel}–${s.endLabel}`"></span>
                      <span x-show="idx===current" class="tag tag-hook">đang chạy</span>
                      <span x-show="idx<current" class="tag tag-core">✓ xong</span>
                    </div>
                  </div>
                </div>
              </div>
            </template>
          </div>
          <div class="flex gap-2 mt-3">
            <button class="btn btn-primary flex-1" @click="toggleLive()" x-text="live ? '⏸ Tạm dừng phiên' : '▶ Bắt đầu live'"></button>
            <a href="postlive.html" @click="endLive($event)" class="btn btn-danger">Kết thúc →</a>
          </div>
          <button class="btn btn-ghost w-full mt-1 text-xs" @click="prevSlot()" :disabled="current<=0">← Khung trước</button>
          <button class="btn btn-ghost w-full text-xs" @click="nextSlot()" :disabled="current>=show.length-1">Khung sau →</button>
        </aside>

        <!-- CENTER: current frame detail -->
        <section class="lg:col-span-5 card p-4">
          <template x-if="!cur">
            <div class="muted text-sm">Chọn một khung trong timeline.</div>
          </template>
          <template x-if="cur">
            <div>
              <div class="flex items-center gap-2 mb-3">
                <span class="tag" :class="roleTag(cur.role)" x-text="roleLabel(cur.role)"></span>
                <span class="font-bold" x-text="`${cur.startLabel}–${cur.endLabel}`"></span>
              </div>
              <div class="text-xs muted mb-1">SKU chính</div>
              <template x-for="sk in cur.skus" :key="sk.item_id">
                <div class="card p-3 mb-2 flex items-center gap-3">
                  <img x-show="false">
                  <div class="flex-1 min-w-0">
                    <div class="font-semibold truncate" x-text="sk.name" :title="sk.name"></div>
                    <div class="text-xs muted mono" x-text="sk.item_id"></div>
                  </div>
                  <div class="text-right">
                    <div class="mono font-bold" x-text="AREA303.vnd(sk.price)"></div>
                    <div class="text-[11px] muted mono" x-text="'gốc ' + AREA303.vnd(sk.orig) + ' · −'+(sk.disc_pct||cur.disc||0)+'%'"></div>
                  </div>
                </div>
              </template>
              <template x-if="cur.bundle">
                <div class="grid grid-cols-2 gap-2 mb-2">
                  <template x-for="(v,k) in cur.bundle" :key="k">
                    <div class="card p-2">
                      <div class="text-[11px] muted uppercase font-bold" x-text="k"></div>
                      <div class="font-semibold text-sm" x-text="v.name"></div>
                      <div class="text-xs mono" x-text="AREA303.vnd(v.price)"></div>
                    </div>
                  </template>
                </div>
              </template>

              <div class="text-xs muted mb-1">Gợi ý lời dẫn</div>
              <ol class="list-decimal list-inside text-sm space-y-1">
                <template x-for="h in hints(cur)" :key="h">
                  <li x-text="h"></li>
                </template>
              </ol>

              <div class="flex flex-wrap gap-2 mt-3">
                <button class="btn btn-ghost" @click="dash('flash 🔥')">Áp dụng flash</button>
                <button class="btn btn-ghost" @click="dash('voucher 🎟')">Kích voucher</button>
                <button class="btn btn-ok" @click="recordOrder()">Ghi 1 đơn (+1)</button>
              </div>
              <div x-show="log.length" class="mt-3 text-[11px] muted mono">Event log: <span x-text="log.join(' · ')"></span></div>
            </div>
          </template>
        </section>

        <!-- RIGHT: chat & orders -->
        <aside class="lg:col-span-3 space-y-3">
          <div class="card p-3">
            <div class="section-h mb-2"><span class="step">$</span> Đơn trong phiên</div>
            <div class="stat mb-2"><div class="k">Số đơn đã ghi</div><div class="v" x-text="num(log.filter(x=>x.includes('order')).length)"></div></div>
            <button class="btn btn-ghost w-full text-xs" @click="log=[];save()">Xoá log</button>
          </div>
          <div class="card p-3">
            <div class="section-h mb-2"><span class="step">💬</span> Chat (mock)</div>
            <ul class="text-xs space-y-1 muted">
              <li>— "Còn hàng không shop?"</li>
              <li>— "Combo này có giảm thêm không?"</li>
              <li>— "Ship về Hà Nội mất mấy ngày?"</li>
            </ul>
            <p class="text-[11px] muted mt-2">Placeholder — tích hợp API chat/đơn khi có.</p>
          </div>
        </aside>
      </div>
    </template>
  </main>

  <script src="static/js/data.js"></script>
  <script src="static/js/app.js"></script>
  <script src="static/js/onair.js"></script>
</body>
</html>
