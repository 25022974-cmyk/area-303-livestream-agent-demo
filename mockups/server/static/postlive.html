<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Post-live Review · AREA_303</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="static/css/style.css">
</head>
<body class="min-h-full" x-data="postlive()" x-init="init()" x-cloak>
  <header class="border-b bg-white">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center gap-3">
      <a href="index.html" class="w-9 h-9 rounded-xl flex items-center justify-center text-white font-extrabold" style="background:var(--brand)">A3</a>
      <div class="flex-1 min-w-0">
        <div class="font-extrabold leading-none">Post-live Review</div>
        <div class="text-xs muted truncate">Đo lường & học lại cho phiên sau</div>
      </div>
      <div class="progress hidden md:flex">
        <div class="seg done"><span class="dot"></span><a href="prelive.html" class="hover:underline">1 · Pre</a></div>
        <div class="bar done"></div>
        <div class="seg done"><span class="dot"></span><a href="onair.html" class="hover:underline">2 · On-air</a></div>
        <div class="bar done"></div>
        <div class="seg active"><span class="dot"></span><span>3 · Post</span></div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 space-y-5">

    <!-- empty state -->
    <template x-if="!hasSession">
      <div class="card p-8 text-center">
        <div class="text-4xl mb-2">📋</div>
        <div class="font-bold text-lg">Chưa có phiên nào kết thúc</div>
        <p class="muted text-sm mt-1 max-w-md mx-auto">Chạy một phiên live: Pre-live → On-air → kết thúc. Kết quả sẽ về đây để bạn nhập chi phí, tính lại hero-score và đề xuất live sau.</p>
        <a href="prelive.html" class="btn btn-primary mt-4 inline-flex">← Lập phiên live</a>
      </div>
    </template>

    <template x-if="hasSession">
      <div>
        <!-- SECTION 1: Tổng quan -->
        <section class="card p-4">
          <div class="section-h mb-3"><span class="step">1</span> Tổng quan phiên</div>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <div class="stat"><div class="k">SKU đã live</div><div class="v" x-text="num(skusInShow.length)"></div><div class="sub" x-text="'trên '+num(items.length)+' tổng'"></div></div>
            <div class="stat"><div class="k">Số đơn ghi</div><div class="v" x-text="num(ordersCount)"></div><div class="sub">từ log on-air</div></div>
            <div class="stat"><div class="k">GMV ước tính</div><div class="v" x-text="AREA303.vnd(gmv)"></div><div class="sub">= đơn × giá TB</div></div>
            <div class="stat"><div class="k">AOV ước tính</div><div class="v" x-text="AREA303.vnd(aov)"></div><div class="sub">giá trị đơn TB</div></div>
          </div>
          <div class="text-[11px] muted mt-2">Lượt xem đỉnh / thời gian xem TB / ROAS cần tích hợp API livestream thật — chừa sẵn.</div>
        </section>

        <!-- SECTION 2: Kết quả theo SKU -->
        <section class="card p-4">
          <div class="section-h mb-3"><span class="step">2</span> Kết quả theo SKU</div>
          <div class="scroll">
            <table class="sku">
              <thead><tr><th>SKU</th><th>Giá</th><th>HeroScore</th><th>Sold/tháng</th><th>Đơn ghi</th><th>Doanh thu ước tính</th><th>Fbk</th></tr></thead>
              <tbody>
                <template x-for="r in skuResults" :key="r.item_id">
                  <tr>
                    <td><div class="font-semibold max-w-[240px] truncate" x-text="r.name" :title="r.name"></div><div class="text-[11px] muted mono" x-text="r.item_id"></div></td>
                    <td class="mono" x-text="AREA303.vnd(r.price)"></td>
                    <td class="mono" x-text="r.hero_score.toFixed(2)"></td>
                    <td class="mono" x-text="num(r.ms)"></td>
                    <td class="mono">
                      <input type="number" min="0" class="inp !py-1 !w-20" x-model.number="r.orders" @input="recalc(r)">
                    </td>
                    <td class="mono" x-text="AREA303.vnd(r.revenue)"></td>
                    <td>
                      <select class="inp !py-1 !w-24" x-model="r.feedback" @change="recalc(r);save()">
                        <option value="">—</option>
                        <option value="win">✓ đúng dự đoán</option>
                        <option value="over">↑ vượt</option>
                        <option value="under">↓ dưới</option>
                        <option value="skip">bỏ live sau</option>
                      </select>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
          <div class="text-xs muted mt-2">Số đơn tự nhập (mặc định ≈ ước tính từ ms ·预期). Feedback ‘win/over/under/skip’ sẽ nạp vào learner trọng số cho phiên sau.</div>
        </section>

        <!-- SECTION 3: Cập nhật sau live -->
        <section class="card p-4">
          <div class="section-h mb-3"><span class="step">3</span> Cập nhật sau live</div>
          <div class="grid md:grid-cols-3 gap-3">
            <div class="md:col-span-2 grid sm:grid-cols-2 gap-3">
              <label class="text-xs font-semibold">Chi phí ads (VND)<input type="number" class="inp mt-1" x-model.number="cost.ads" @input="save()"></label>
              <label class="text-xs font-semibold">Chi phí voucher (VND)<input type="number" class="inp mt-1" x-model.number="cost.voucher" @input="save()"></label>
              <label class="text-xs font-semibold">Chi phí nhân sự (VND)<input type="number" class="inp mt-1" x-model.number="cost.staff" @input="save()"></label>
              <label class="text-xs font-semibold">Khác (VND)<input type="number" class="inp mt-1" x-model.number="cost.other" @input="save()"></label>
              <label class="text-xs font-semibold sm:col-span-2">Ghi chú / sự cố <textarea class="inp mt-1" rows="2" x-model="cost.notes" @input="save()"></textarea></label>
            </div>
            <div class="card p-3">
              <div class="text-xs muted">Tổng chi phí</div>
              <div class="mono font-extrabold text-lg" x-text="AREA303.vnd(totalCost)"></div>
              <div class="text-xs muted mt-3">Lợi nhuận gộp ước tính</div>
              <div class="mono font-extrabold text-lg" :class="profit>=0?'text-[var(--ok)]':'text-[var(--danger)]'" x-text="AREA303.vnd(profit)"></div>
              <div class="text-[11px] muted mt-1">GMV − tổng chi phí (chưa trừ COGS).</div>
            </div>
          </div>
          <button class="btn btn-primary mt-4" @click="runLearner()">Tính lại hero-score & lưu →</button>
          <div x-show="learned" class="mt-3 text-sm text-[var(--ok)] font-semibold">✓ Đã cập nhật learning_state. Hệ số trọng số đã điều chỉnh theo feedback phiên này.</div>
        </section>

        <!-- SECTION 4: Đề xuất cho live sau -->
        <section class="card p-4">
          <div class="section-h mb-3"><span class="step">4</span> Đề xuất cho live sau</div>
          <div class="grid md:grid-cols-2 gap-4">
            <div>
              <div class="text-xs font-semibold muted mb-2">SKU nên GIỮ làm chủ lực</div>
              <template x-for="i in keepers" :key="i.item_id">
                <div class="card p-2 mb-1 flex items-center justify-between">
                  <span class="text-sm truncate" x-text="i.name"></span>
                  <span class="mono text-xs" x-text="'hs '+i.hero_score.toFixed(2)"></span>
                </div>
              </template>
              <div x-show="!keepers.length" class="muted text-xs">—</div>
            </div>
            <div>
              <div class="text-xs font-semibold muted mb-2">SKU nên LOẠI / thay</div>
              <template x-for="i in droppers" :key="i.item_id">
                <div class="card p-2 mb-1 flex items-center justify-between">
                  <span class="text-sm truncate" x-text="i.name"></span>
                  <span class="tag tag-clear" x-text="i.reason"></span>
                </div>
              </template>
              <div x-show="!droppers.length" class="muted text-xs">—</div>
            </div>
          </div>
          <div class="mt-3 text-sm">
            <span class="muted">Khung giờ đề xuất phiên sau: </span><b x-text="nextSlot"></b>
          </div>
          <a href="prelive.html" class="btn btn-primary mt-4 inline-flex">Lập phiên tiếp theo →</a>
        </section>
      </div>
    </template>
  </main>

  <script src="static/js/data.js"></script>
  <script src="static/js/app.js"></script>
  <script src="static/js/postlive.js"></script>
</body>
</html>
